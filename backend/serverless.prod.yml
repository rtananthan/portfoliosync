service: portfoliosync-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'ap-southeast-2'}
  stage: prod
  
  memorySize: 512  # Increased for production
  timeout: 30
  
  environment:
    STAGE: prod
    REGION: ${self:provider.region}
    PORTFOLIOS_TABLE: ${self:service}-prod-portfolios
    STOCKS_TABLE: ${self:service}-prod-stocks
    ETFS_TABLE: ${self:service}-prod-etfs
    PROPERTIES_TABLE: ${self:service}-prod-properties
    PRICE_HISTORY_TABLE: ${self:service}-prod-price-history
    NEWS_TABLE: ${self:service}-prod-news
    
    # Production Security Configuration
    AUTH_ENABLED: true
    DEV_MODE: false
    VALIDATION_LEVEL: strict
    
    # API Keys (from AWS Secrets Manager in production)
    ALPHA_VANTAGE_API_KEY: ${ssm:/portfoliosync/prod/alpha-vantage-key}
    FINNHUB_API_KEY: ${ssm:/portfoliosync/prod/finnhub-key}
    NEWS_API_KEY: ${ssm:/portfoliosync/prod/news-api-key}
    BEDROCK_REGION: us-east-1
    
    # Production Authentication
    COGNITO_USER_POOL_ID: ${ssm:/portfoliosync/prod/cognito-user-pool-id}
    COGNITO_CLIENT_ID: ${ssm:/portfoliosync/prod/cognito-client-id}
    JWT_SECRET: ${ssm:/portfoliosync/prod/jwt-secret}
    ENCRYPTION_KEY: ${ssm:/portfoliosync/prod/encryption-key}
    
    # Version tracking
    APP_VERSION: 1.0.0
  
  httpApi:
    cors:
      allowedOrigins:
        - https://investmenttracker.com.au  # Your production domain
        - https://d1s0t04ct1krwo.cloudfront.net  # CloudFront distribution
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    throttle:
      burstLimit: 200  # Production limits
      rateLimit: 100
  
  # Production tags
  tags:
    Application: portfoliosync
    Environment: production
    Version: 1.0.0
    Project: investment-platform
    Owner: ${env:OWNER_EMAIL, 'rtananthan@yahoo.com'}
    CostCenter: portfoliosync-prod
    Criticality: high
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PORTFOLIOS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.STOCKS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ETFS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PROPERTIES_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PRICE_HISTORY_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.NEWS_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PORTFOLIOS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.STOCKS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ETFS_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PROPERTIES_TABLE}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.NEWS_TABLE}/index/*"
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - "arn:aws:ssm:${self:provider.region}:*:parameter/portfoliosync/prod/*"
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - "arn:aws:secretsmanager:${self:provider.region}:*:secret:portfoliosync/prod/*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            - bedrock-runtime:InvokeModel
          Resource:
            - "arn:aws:bedrock:us-east-1:*:foundation-model/*"

functions:
  getPortfolios:
    handler: functions/portfolio/get_portfolios.handler
    events:
      - httpApi:
          path: /portfolios
          method: get

  createPortfolio:
    handler: functions/portfolio/create_portfolio.handler
    events:
      - httpApi:
          path: /portfolios
          method: post

  getStocks:
    handler: functions/stocks/get_stocks.handler
    events:
      - httpApi:
          path: /portfolios/{portfolioId}/stocks
          method: get

  createStock:
    handler: functions/stocks/create_stock.handler
    events:
      - httpApi:
          path: /portfolios/{portfolioId}/stocks
          method: post

  updateStock:
    handler: functions/stocks/update_stock.handler
    events:
      - httpApi:
          path: /stocks/{stockId}
          method: put

  deleteStock:
    handler: functions/stocks/delete_stock.handler
    events:
      - httpApi:
          path: /stocks/{stockId}
          method: delete

  updateStockPrices:
    handler: functions/stocks/update_prices.handler
    timeout: 60
    events:
      - httpApi:
          path: /stocks/update-prices
          method: post
      - schedule:
          rate: rate(1 hour)
          description: 'Hourly stock price updates'

  getETFs:
    handler: functions/etfs/get_etfs.handler
    events:
      - httpApi:
          path: /portfolios/{portfolioId}/etfs
          method: get

  createETF:
    handler: functions/etfs/create_etf.handler
    events:
      - httpApi:
          path: /portfolios/{portfolioId}/etfs
          method: post

  updateETF:
    handler: functions/etfs/update_etf.handler
    events:
      - httpApi:
          path: /etfs/{etfId}
          method: put

  deleteETF:
    handler: functions/etfs/delete_etf.handler
    events:
      - httpApi:
          path: /etfs/{etfId}
          method: delete

  getProperties:
    handler: functions/properties/get_properties.handler
    events:
      - httpApi:
          path: /portfolios/{portfolioId}/properties
          method: get

  createProperty:
    handler: functions/properties/create_property.handler
    events:
      - httpApi:
          path: /portfolios/{portfolioId}/properties
          method: post

  updateProperty:
    handler: functions/properties/update_property.handler
    events:
      - httpApi:
          path: /properties/{propertyId}
          method: put

  deleteProperty:
    handler: functions/properties/delete_property.handler
    events:
      - httpApi:
          path: /properties/{propertyId}
          method: delete

  getNews:
    handler: functions/news/get_news.handler
    events:
      - httpApi:
          path: /news/{symbol}
          method: get

  getAllNews:
    handler: functions/news/get_all_news.handler
    events:
      - httpApi:
          path: /news
          method: get

  refreshNews:
    handler: functions/news/refresh_news.handler
    timeout: 300
    events:
      - httpApi:
          path: /news/refresh/{symbol}
          method: post
      - schedule:
          rate: rate(6 hours)
          description: 'Production news refresh every 6 hours'

  generateNewsInsights:
    handler: functions/news/generate_insights.handler
    timeout: 300
    events:
      - httpApi:
          path: /news/insights/{symbol}
          method: post

resources:
  Resources:
    # Production DynamoDB tables with encryption
    PortfoliosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PORTFOLIOS_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: production
          - Key: Application
            Value: portfoliosync

    StocksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.STOCKS_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: portfolioId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: portfolioId-index
            KeySchema:
              - AttributeName: portfolioId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    ETFsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ETFS_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: portfolioId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: portfolioId-index
            KeySchema:
              - AttributeName: portfolioId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    PropertiesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PROPERTIES_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: portfolioId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: portfolioId-index
            KeySchema:
              - AttributeName: portfolioId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    PriceHistoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PRICE_HISTORY_TABLE}
        AttributeDefinitions:
          - AttributeName: symbol
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: symbol
            KeyType: HASH
          - AttributeName: date
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true

    NewsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.NEWS_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: symbol
            AttributeType: S
          - AttributeName: publishedAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: symbol-publishedAt-index
            KeySchema:
              - AttributeName: symbol
                KeyType: HASH
              - AttributeName: publishedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: publishedAt-index
            KeySchema:
              - AttributeName: publishedAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        SSESpecification:
          SSEEnabled: true

    # Production monitoring and alerting
    ProductionBillingAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: portfoliosync-prod-billing-alarm
        AlarmDescription: Production billing alarm at $50 threshold
        MetricName: EstimatedCharges
        Namespace: AWS/Billing
        Statistic: Maximum
        Period: 86400
        EvaluationPeriods: 1
        Threshold: 50.00
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: Currency
            Value: USD

  Outputs:
    ProductionApiUrl:
      Description: "Production API Gateway URL"
      Value: !Sub "https://${HttpApi}.execute-api.${self:provider.region}.amazonaws.com"
      Export:
        Name: PortfolioSyncProdApiUrl

plugins:
  - serverless-offline